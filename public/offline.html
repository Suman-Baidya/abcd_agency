<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline — ABCD Agency</title>
  <link rel="icon" href="/images/abcd_square_logo.png">
  <link rel="apple-touch-icon" href="/images/abcd_square_logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #0A0A0A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #111111;
      border: 1px solid #262626;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background-color: #1A1A1A;
      border: 1px solid #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      color: #FFFFFF;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    p {
      font-size: 13px;
      color: #A3A3A3;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 6px;
      background-color: rgba(239, 68, 68, 0.15);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      margin-bottom: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      background-color: #FFFFFF;
      color: #0A0A0A;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status-text {
      margin-top: 16px;
      font-size: 11px;
      color: #737373;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" strokeWidth="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.828-5.657a5 5 0 010-7.072m0 0l2.829 2.829m4.243-4.243a1 1 0 011.414 0" />
      </svg>
    </div>
    
    <div class="badge">Offline Mode</div>
    <h1>No Internet Connection</h1>
    <p>
      You are currently disconnected from the network. Previously loaded pages and cached dashboard items remain accessible.
    </p>

    <button class="btn" onclick="checkConnection()">
      Retry Connection
    </button>

    <div class="status-text" id="status-indicator">
      Checking connection status...
    </div>
  </div>

  <script>
    function checkConnection() {
      const statusEl = document.getElementById("status-indicator");
      statusEl.textContent = "Testing network connection...";
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          statusEl.textContent = "Still offline. Please check your Wi-Fi or mobile data.";
        }, 600);
      }
    }

    window.addEventListener("online", () => {
      document.getElementById("status-indicator").textContent = "Connection restored! Reloading...";
      setTimeout(() => {
        window.location.reload();
      }, 500);
    });
  </script>
</body>
</html>
